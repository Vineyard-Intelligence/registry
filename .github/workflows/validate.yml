name: validate
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install jsonschema
      - run: python scripts/validate.py
      - name: Verify pinned commits (immutable SHA + document match)
        run: python scripts/verify_pinned.py
      # The rules first, then the catalog. A scanner whose rules have silently stopped matching
      # reports "no findings" on a malicious pack exactly as it does on a clean one, so the rules
      # are proven against known-bad and known-good samples before they are trusted on real packs.
      - name: Scan rules self-test
        run: python scripts/scan.py --self-test
      - name: Scan pinned bundles and skill packs
        run: python scripts/scan.py
